name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Testar painel, API e persistência
        run: cd painel && bun test

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe do motor de vídeo
        run: |
          python -m py_compile motor/leitor-video/leitor.py
          python -m py_compile motor/leitor-video/conferir-contagem.py
